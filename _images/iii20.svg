      <circle class="geom-point" cx="270" cy="498" r="2.6" data-ref="D"><title>D = (0, -5)</title></circle>
      <circle class="geom-point" cx="87.6" cy="406.8" r="2.6" data-ref="B"><title>B = (-4, -3)</title></circle>
      <circle class="geom-point" cx="406.8" cy="452.4" r="2.6" data-ref="C"><title>C = (3, -4)</title></circle>
