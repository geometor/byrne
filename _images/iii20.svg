      <g class="geom-angle" data-byrne-kind="angle" data-byrne-color="yellow" data-ref="&lt; B A C )" data-aliases="&lt; C A B )"><path class="byrne-plate-wedge byrne-fill-yellow byrne-stroke-yellow" d="M 270 42 L 256.58 68.83 A 30 30 0 0 0 279.49 70.46 Z" /><path class="geom-ang-arc byrne-stroke-yellow" d="M 256.58 68.83 A 30 30 0 0 0 279.49 70.46" fill="none" /><title>&lt; B A C )</title></g>
      <g class="geom-angle" data-byrne-kind="angle" data-byrne-color="blue" data-ref="&lt; B O C )" data-aliases="&lt; C O B )"><path class="byrne-plate-wedge byrne-fill-blue byrne-stroke-blue" d="M 270 270 L 246 288 A 30 30 0 0 0 288 294 Z" /><path class="geom-ang-arc byrne-stroke-blue" d="M 246 288 A 30 30 0 0 0 288 294" fill="none" /><title>&lt; B O C )</title></g>
      <g class="geom-angle" data-byrne-kind="angle" data-byrne-color="red" data-ref="&lt; O B A )" data-aliases="&lt; A B O )"><path class="byrne-plate-wedge byrne-fill-red byrne-stroke-red" d="M 87.6 406.8 L 106.8 392.4 A 24 24 0 0 0 98.33 385.33 Z" /><path class="geom-ang-arc byrne-stroke-red" d="M 106.8 392.4 A 24 24 0 0 0 98.33 385.33" fill="none" /><title>&lt; O B A )</title></g>
      <path class="geom-segment byrne-plate-line byrne-stroke-red byrne-thick" d="M 270 42 L 270 156 L 270 270" data-byrne-kind="line" data-byrne-color="red" data-ref="/ A O /" data-aliases="/ O A / | [ A O ] | [ O A ]" fill="none"><title>/ A O /</title></path>
      <path class="geom-segment byrne-plate-line byrne-stroke-red byrne-dotted" d="M 270 270 L 270 384 L 270 498" stroke-dasharray="2.4 3.6" data-byrne-kind="line" data-byrne-color="red" data-ref="/ O D /" data-aliases="/ D O / | [ O D ] | [ D O ]" fill="none"><title>/ O D /</title></path>
      <path class="geom-segment byrne-plate-line byrne-stroke-black byrne-thick" d="M 270 42 L 178.8 224.4 L 87.6 406.8" data-byrne-kind="line" data-byrne-color="black" data-ref="/ A B /" data-aliases="/ B A / | [ A B ] | [ B A ]" fill="none"><title>/ A B /</title></path>
      <path class="geom-segment byrne-plate-line byrne-stroke-black byrne-thick" d="M 270 42 L 338.4 247.2 L 406.8 452.4" data-byrne-kind="line" data-byrne-color="black" data-ref="/ A C /" data-aliases="/ C A / | [ A C ] | [ C A ]" fill="none"><title>/ A C /</title></path>
      <path class="geom-segment byrne-plate-line byrne-stroke-black" d="M 270 270 L 178.8 338.4 L 87.6 406.8" data-byrne-kind="line" data-byrne-color="black" data-ref="/ O B /" data-aliases="/ B O / | [ O B ] | [ B O ]" fill="none"><title>/ O B /</title></path>
      <path class="geom-segment byrne-plate-line byrne-stroke-black" d="M 270 270 L 338.4 361.2 L 406.8 452.4" data-byrne-kind="line" data-byrne-color="black" data-ref="/ O C /" data-aliases="/ C O / | [ O C ] | [ C O ]" fill="none"><title>/ O C /</title></path>
    </g>
