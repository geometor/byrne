      <path class="geom-segment byrne-plate-line byrne-stroke-yellow byrne-dotted" d="M 277 306 L 216.08 280.62 L 155.15 255.23" stroke-dasharray="2.4 3.6" data-byrne-kind="line" data-byrne-color="yellow" data-ref="/ I F /" data-aliases="/ F I / | [ I F ] | [ F I ]" fill="none"><title>/ I F /</title></path>
      <path class="geom-segment byrne-plate-line byrne-stroke-red byrne-dotted" d="M 277 306 L 329.8 266.4 L 382.6 226.8" stroke-dasharray="2.4 3.6" data-byrne-kind="line" data-byrne-color="red" data-ref="/ I G /" data-aliases="/ G I / | [ I G ] | [ G I ]" fill="none"><title>/ I G /</title></path>
