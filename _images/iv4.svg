      <path class="geom-segment byrne-plate-line byrne-stroke-blue" d="M 541 438 L 409 372 L 277 306" data-byrne-kind="line" data-byrne-color="blue" data-ref="/ C I /" data-aliases="/ I C / | [ C I ] | [ I C ]" fill="none"><title>/ C I /</title></path>
