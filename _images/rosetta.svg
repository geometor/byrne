<svg xmlns="http://www.w3.org/2000/svg" class="euclid-graphic" viewBox="0 0 680 296" width="680" height="296" data-graphic-id="rosetta" role="img" aria-label="3-Way Rosetta Synthesis — Heath (1908) · Byrne (1847) · GEOMETOR Symbolic DAG">
  <title>3-Way Rosetta Synthesis — Heath (1908) · Byrne (1847) · GEOMETOR Symbolic DAG</title>
  <style>
  .euclid-graphic, :root {
    --byrne-paper: #faf7f0;
    --byrne-red: #d92b2b;
    --byrne-blue: #1c6ea4;
    --byrne-yellow: #e6b800;
    --byrne-black: #1a1a1a;
    --byrne-fill-red: #d92b2b;
    --byrne-fill-blue: #1c6ea4;
    --byrne-fill-yellow: #e6b800;
    --byrne-fill-black: #1a1a1a;
    --byrne-halo: rgba(250, 247, 240, 0.92);
  }
  @media (prefers-color-scheme: dark) {
    .euclid-graphic, :root {
      --byrne-paper: #16161a;
      --byrne-red: #f04848;
      --byrne-blue: #4ba3e3;
      --byrne-yellow: #f5ca24;
      --byrne-black: #e8e6df;
      --byrne-fill-red: #d93838;
      --byrne-fill-blue: #2574ab;
      --byrne-fill-yellow: #dfb208;
      --byrne-fill-black: #363945;
      --byrne-halo: rgba(22, 22, 26, 0.92);
    }
  }
  .euclid-graphic .svg-bg { fill: var(--byrne-paper); }
  .euclid-graphic .byrne-stroke-red { stroke: var(--byrne-red); }
  .euclid-graphic .byrne-stroke-blue { stroke: var(--byrne-blue); }
  .euclid-graphic .byrne-stroke-yellow { stroke: var(--byrne-yellow); }
  .euclid-graphic .byrne-stroke-black { stroke: var(--byrne-black); }
  .euclid-graphic .byrne-stroke-none { stroke: none; }
  .euclid-graphic .byrne-fill-red { fill: var(--byrne-fill-red); }
  .euclid-graphic .byrne-fill-blue { fill: var(--byrne-fill-blue); }
  .euclid-graphic .byrne-fill-yellow { fill: var(--byrne-fill-yellow); }
  .euclid-graphic .byrne-fill-black { fill: var(--byrne-fill-black); }
  .euclid-graphic .byrne-fill-none { fill: none; }
  .euclid-graphic .byrne-dotted { stroke-dasharray: 2.6 3.8; }
  .euclid-graphic .byrne-dashed { stroke-dasharray: 7 4.2; }
  .euclid-graphic .byrne-plate-line { fill: none; stroke-width: 3.6; stroke-linecap: round; }
  .euclid-graphic .byrne-plate-circle { fill: none; stroke-width: 2.7; stroke-linecap: round; }
  .euclid-graphic .byrne-plate-poly { stroke-linejoin: round; stroke-width: 2.2; }
  .euclid-graphic .byrne-plate-wedge { fill-opacity: 0.88; stroke-width: 1.4; stroke-linejoin: round; }
  .euclid-graphic .byrne-ink {
    fill: var(--byrne-black);
    font-family: "EB Garamond", "Cochineal", "Georgia", serif;
  }
  .euclid-graphic .byrne-caption {
    fill: var(--byrne-black);
    opacity: 0.78;
    font-size: 13px;
    font-style: italic;
    font-family: "EB Garamond", "Georgia", serif;
  }
  .euclid-graphic .byrne-heading {
    fill: var(--byrne-black);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.08em;
    font-family: "EB Garamond", "Georgia", serif;
  }
  .euclid-graphic .byrne-op-text {
    fill: var(--byrne-black);
    font-size: 21px;
    font-weight: 600;
    font-family: "EB Garamond", "Georgia", serif;
  }
  .euclid-graphic .byrne-mult {
    fill: var(--byrne-black);
    font-size: 19px;
    font-style: italic;
    font-weight: 600;
    font-family: "EB Garamond", "Georgia", serif;
  }
  .euclid-graphic .byrne-rule {
    stroke: var(--byrne-black);
    stroke-opacity: 0.22;
    stroke-width: 1.1;
  }
  .euclid-graphic .byrne-frac-bar {
    stroke: var(--byrne-black);
    stroke-width: 2.0;
    stroke-linecap: round;
  }

  </style>
  <rect class="svg-bg" x="0" y="0" width="680" height="296" rx="6" />
  <g id="elements">
    <g id="graphics">
      <line class="byrne-rule" x1="228" y1="26" x2="228" y2="278" />
      <line class="byrne-rule" x1="454" y1="26" x2="454" y2="278" />
      <text class="byrne-heading" x="116.0" y="42.0" text-anchor="middle">1. HEATH (1908)</text>
      <text class="byrne-caption" x="116.0" y="70.0" text-anchor="middle">Pass-by-Reference</text>
      <polygon class="byrne-fill-none byrne-stroke-black" points="72,170 160,170 104,118" stroke-width="2.0" />
      <text class="byrne-caption" x="102.0" y="112.0" text-anchor="middle">A</text>
      <text class="byrne-caption" x="62.0" y="176.0" text-anchor="middle">B</text>
      <text class="byrne-caption" x="170.0" y="176.0" text-anchor="middle">C</text>
      <text class="byrne-caption" x="116.0" y="214.0" text-anchor="middle">□BDEC = □ABFG + □ACKH</text>
      <text class="byrne-mult" x="116.0" y="242.0" text-anchor="middle">64 vertex pointers</text>
      <text class="byrne-heading" x="341.0" y="42.0" text-anchor="middle">2. BYRNE (1847)</text>
      <text class="byrne-caption" x="341.0" y="70.0" text-anchor="middle">Pass-by-Value Registers</text>
      <rect class="byrne-fill-yellow byrne-stroke-yellow" x="256" y="114" width="30" height="44" />
      <text class="byrne-op-text" x="300.0" y="143.0" text-anchor="middle">+</text>
      <rect class="byrne-fill-blue byrne-stroke-blue" x="314" y="114" width="22" height="44" />
      <text class="byrne-op-text" x="350.0" y="143.0" text-anchor="middle">=</text>
      <rect class="byrne-fill-black byrne-stroke-black" x="365.0" y="123.0" width="26.0" height="26.0" stroke-width="1.5" />
      <text class="byrne-op-text" x="404.0" y="143.0" text-anchor="middle">+</text>
      <rect class="byrne-fill-red byrne-stroke-red" x="420.0" y="126.0" width="20.0" height="20.0" stroke-width="1.5" />
      <text class="byrne-caption" x="341.0" y="214.0" text-anchor="middle">Self-naming area literals</text>
      <text class="byrne-mult" x="341.0" y="242.0" text-anchor="middle">0 vertex pointers</text>
      <text class="byrne-heading" x="566.0" y="42.0" text-anchor="middle">3. GEOMETOR DAG</text>
      <text class="byrne-caption" x="566.0" y="70.0" text-anchor="middle">Exact SymPy Algebra</text>
      <circle class="byrne-fill-red byrne-stroke-red" cx="516" cy="122" r="9" />
      <circle class="byrne-fill-blue byrne-stroke-blue" cx="616" cy="122" r="9" />
      <circle class="byrne-fill-yellow byrne-stroke-yellow" cx="566" cy="168" r="10" />
      <line class="byrne-stroke-black" x1="523" y1="129" x2="558" y2="161" stroke-width="2.0" />
      <line class="byrne-stroke-black" x1="609" y1="129" x2="574" y2="161" stroke-width="2.0" />
      <text class="byrne-caption" x="566.0" y="214.0" text-anchor="middle">Q(B,C) = Q(A,B) + Q(A,C)</text>
      <text class="byrne-mult" x="566.0" y="242.0" text-anchor="middle">0 sp.Float atoms</text>
    </g>
    <g id="highlights"></g>
    <g id="points"></g>
    <g id="labels"></g>
  </g>
</svg>
